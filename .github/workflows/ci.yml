name: CI

on:
  push:
    branches: [godot3, main]
  pull_request:
  workflow_dispatch:
    inputs:
      check_all:
        description: "校验全部脚本（默认只校验本次变更的 .gd 文件，全量约 16 分钟）"
        type: boolean
        default: false

jobs:
  script-check:
    name: 脚本语法校验（Godot 3.6.3）
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 需要历史以计算变更文件范围
          fetch-depth: 0

      # Godot 3.6.3 无 --headless 参数（那是 4.x 的），无窗口运行用 --no-window；
      # linux_headless 版二进制本身不含 X11 依赖。
      - name: 缓存 Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-editor-3.6.3-stable-linux-headless

      - name: 下载 Godot 3.6.3
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin
          url="https://github.com/godotengine/godot/releases/download/3.6.3-stable/Godot_v3.6.3-stable_linux_headless.64.zip"
          curl -fsSL -o /tmp/godot.zip "$url"
          unzip -q -o /tmp/godot.zip -d /tmp/godot-extract
          bin=$(find /tmp/godot-extract -type f -name 'Godot*' | head -1)
          [ -n "$bin" ] || { echo "压缩包内未找到 Godot 可执行文件"; ls -la /tmp/godot-extract; exit 1; }
          cp "$bin" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: 验证 Godot
        run: ~/godot-bin/godot --version

      - name: 计算待校验文件清单
        id: files
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHECK_ALL: ${{ inputs.check_all }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${CHECK_ALL:-}" = "true" ]; then
            echo "全量校验模式"
            (cd bwdl && find . -name '*.gd' | sed 's|^\./|res://|' | sort) > /tmp/files.txt
          else
            # 只校验本次变更涉及的 .gd（Godot 3.x 无 --import，全量校验 1378 文件 × 0.7s ≈ 16 分钟）
            if [ "$EVENT_NAME" = "pull_request" ]; then
              git fetch --no-tags origin "$BASE_REF" || true
              RANGE="origin/$BASE_REF...HEAD"
            else
              RANGE="$BEFORE_SHA..$HEAD_SHA"
              # 首次推送或 before 为全零时退化为与上一提交比较
              case "$BEFORE_SHA" in
                0000000*) RANGE="HEAD~1..HEAD" ;;
              esac
            fi
            echo "变更范围: $RANGE"
            git diff --name-only --diff-filter=ACMR "$RANGE" -- 'bwdl/**/*.gd' 2>/dev/null \
              | sed 's|^bwdl/|res://|' | sort > /tmp/files.txt || true
            # 若范围计算失败（如新分支），退化为最近一次提交的变更
            if [ ! -s /tmp/files.txt ]; then
              git diff --name-only --diff-filter=ACMR HEAD~1 HEAD -- 'bwdl/**/*.gd' \
                | sed 's|^bwdl/|res://|' | sort > /tmp/files.txt || true
            fi
          fi
          n=$(wc -l < /tmp/files.txt | tr -d ' ')
          echo "待校验 $n 个文件"
          # 注意用 awk 而非 `sed | head`：head 提前关闭管道会让 sed 收到 SIGPIPE，
          # 在 set -o pipefail 下整步被判失败（曾踩，exit code 4）
          awk 'NR<=50 {print "  " $0} END {if (NR>50) print "  ... 共 " NR " 个"}' /tmp/files.txt
          echo "count=$n" >> "$GITHUB_OUTPUT"

      # 用 --check-only -s 逐文件校验。注意：
      #  - 该工程是反编译产物，clEquip/clVState/Static_Manager/clEnvBase 等存在循环引用，
      #    且部分 .tscn 引用了不存在的资源，导致 --check-only 无法解析依赖图，产生大量
      #    "加载失败" 类 Parse Error 噪音；**校验正常文件时退出码也是 1**，不能用退出码判断。
      #  - 噪音的共同特征是描述「依赖/类加载失败」；真正的语法错误是词法/语法结构描述
      #    （如 "Unexpected two consecutive operators."）。
      #  - NOISE 的每一条都来自对全工程 1378 个文件实测归纳，勿凭猜测增删。
      - name: 校验脚本语法
        if: steps.files.outputs.count != '0'
        run: |
          set -uo pipefail
          GODOT=~/godot-bin/godot
          NOISE='couldn.t be fully loaded'
          NOISE="$NOISE|was found in global scope"
          NOISE="$NOISE|Couldn.t load the base class"
          NOISE="$NOISE|Couldn.t fully load the singleton"
          NOISE="$NOISE|isn.t fully loaded"
          NOISE="$NOISE|isn.t declared in the current scope"
          NOISE="$NOISE|Unknown class"
          NOISE="$NOISE|Can.t preload resource"
          NOISE="$NOISE|referenced nonexistent resource"
          NOISE="$NOISE|cyclic reference"
          NOISE="$NOISE|cyclic preload"
          NOISE="$NOISE|cyclic inheritance"
          NOISE="$NOISE|cyclic dependency"
          NOISE="$NOISE|already being loaded"
          # clEnvBase 循环引用的次生噪音：该报文的 at: 恒指向 cheat/war_actor_detail.gd:10
          # 这一依赖文件，从不指向被校验文件（已实测确认）
          NOISE="$NOISE|Expected a constant expression"
          fail=0
          total=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            total=$((total+1))
            res=$(timeout 180 "$GODOT" --no-window --path bwdl --check-only -s "$f" 2>&1 || true)
            errs=$(printf '%s\n' "$res" | grep 'Parse Error:' | grep -vE "$NOISE" || true)
            if [ -n "$errs" ]; then
              echo "::error file=${f#res://}::语法错误"
              printf '%s\n' "$errs" | sed 's/^/    /'
              printf '%s\n' "$res" | grep -A1 'Parse Error:' | grep 'at:' | head -3 | sed 's/^/    /'
              fail=$((fail+1))
            fi
          done < /tmp/files.txt
          echo "已校验 $total 个脚本，其中 $fail 个有语法错误"
          [ "$fail" -eq 0 ] || exit 1

      - name: 无变更脚本需校验
        if: steps.files.outputs.count == '0'
        run: echo "本次变更未涉及 .gd 脚本，跳过校验"
