name: 💡 功能建议
description: 建议新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 描述这个功能要解决的痛点
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 描述你期望的实现方式
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 其它可行方案（可选）
  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 任何有助于理解的信息
