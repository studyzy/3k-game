<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agent 决策监控面板</title>
<style>
  :root {
    --bg: #0f1218; --panel: #171c26; --panel2: #1e2532; --line: #2b3444;
    --fg: #dce3ee; --dim: #8b98ad; --accent: #5aa9ff;
    --sys: #7d8798; --user: #9aa7ba; --turn: #4b586d;
    --assistant: #5aa9ff; --call: #b48cff; --result: #57d9a3;
    --final: #ffd166; --error: #ff6b6b; --mock: #f0a35e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  a { color: var(--accent); }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .badge { padding: 2px 8px; border-radius: 10px; background: var(--panel2);
    border: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  .badge.mode { color: var(--accent); }
  .spacer { flex: 1; }
  button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 11px; cursor: pointer; font-size: 12px; }
  button:hover { border-color: var(--accent); }
  button.on { color: var(--result); border-color: var(--result); }
  .body { display: flex; height: calc(100vh - 49px); }
  aside { width: 320px; min-width: 260px; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); }
  main { flex: 1; overflow-y: auto; padding: 16px 20px 60px; }
  .card { padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .card:hover { background: var(--panel2); }
  .card.sel { background: #202a3c; border-left: 3px solid var(--accent); padding-left: 9px; }
  .card .row1 { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .card .time { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .card .tk { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; color: var(--fg);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .row2 { color: var(--dim); font-size: 11px; display: flex; gap: 8px; flex-wrap: wrap; }
  .st { font-size: 10px; padding: 1px 6px; border-radius: 8px; border: 1px solid var(--line); }
  .st.ok { color: var(--result); border-color: #2c6b52; }
  .st.running { color: var(--accent); }
  .st.error { color: var(--error); border-color: #7a3535; }
  .st.fallback { color: var(--mock); }
  .empty { color: var(--dim); padding: 24px; text-align: center; }
  .meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); font-size: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; }
  .meta b { color: var(--fg); font-weight: 500; }
  details { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; }
  details > summary { cursor: pointer; padding: 8px 12px; color: var(--dim); font-size: 12px; user-select: none; }
  details > summary:hover { color: var(--fg); }
  pre { margin: 0; padding: 10px 14px; overflow-x: auto; white-space: pre-wrap; word-break: break-word;
    font: 12px/1.55 ui-monospace, Menlo, Consolas, monospace; color: var(--fg); border-top: 1px solid var(--line); }
  .timeline { display: flex; flex-direction: column; gap: 8px; }
  .ev { border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 6px;
    background: var(--panel); padding: 8px 12px; }
  .ev .head { display: flex; gap: 10px; align-items: baseline; color: var(--dim); font-size: 11px; margin-bottom: 4px; }
  .ev .kind { font-weight: 600; font-size: 11px; letter-spacing: .4px; text-transform: uppercase; }
  .ev .seq { font-variant-numeric: tabular-nums; }
  .ev .body { white-space: pre-wrap; word-break: break-word; color: var(--fg); font-size: 12.5px; }
  .ev .json { margin-top: 6px; background: var(--panel2); border-radius: 4px;
    font: 11.5px/1.5 ui-monospace, Menlo, Consolas, monospace; padding: 8px 10px;
    white-space: pre-wrap; word-break: break-word; color: #c7d3e6; }
  .ev.turn { border-left-color: var(--turn); background: transparent; padding: 4px 12px; }
  .ev.turn .body { color: var(--turn); font-size: 11px; }
  .ev.system { border-left-color: var(--sys); } .ev.system .kind { color: var(--sys); }
  .ev.user { border-left-color: var(--user); } .ev.user .kind { color: var(--user); }
  .ev.assistant { border-left-color: var(--assistant); } .ev.assistant .kind { color: var(--assistant); }
  .ev.tool_call { border-left-color: var(--call); } .ev.tool_call .kind { color: var(--call); }
  .ev.tool_result { border-left-color: var(--result); } .ev.tool_result .kind { color: var(--result); }
  .ev.tool_result.bad { border-left-color: var(--error); } .ev.tool_result.bad .kind { color: var(--error); }
  .ev.final { border-left-color: var(--final); } .ev.final .kind { color: var(--final); }
  .ev.error { border-left-color: var(--error); } .ev.error .kind { color: var(--error); }
  .ev.mock { border-left-color: var(--mock); } .ev.mock .kind { color: var(--mock); }
  .toggle { color: var(--accent); cursor: pointer; font-size: 11px; user-select: none; }
  .clamp { max-height: 160px; overflow: hidden; position: relative; }
  .clamp::after { content: "…点击展开"; position: absolute; bottom: 0; right: 0; left: 0;
    text-align: right; padding: 0 8px; background: linear-gradient(transparent, var(--panel)); color: var(--accent); font-size: 11px; }
  .hint { color: var(--dim); font-size: 11px; margin-bottom: 12px; }
</style>
</head>
<body>
<header>
  <h1>AI Agent 决策监控面板</h1>
  <span class="badge mode" id="mode">mode: …</span>
  <span class="badge" id="count">0 条轨迹</span>
  <span class="spacer"></span>
  <button id="autoBtn" class="on">自动刷新 · 开</button>
  <button id="clearBtn">清空</button>
</header>
<div class="body">
  <aside id="list"><div class="empty">暂无决策记录<br><br>进入战争场景（「大模型」难度）后，AI 回合会出现在这里</div></aside>
  <main id="detail"><div class="empty">← 选择左侧一条轨迹查看完整对话</div></main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const state = { selected: null, auto: true, expanded: new Set(), lastSig: "" };

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString("zh-CN", { hour12: false }) + "." + String(d.getMilliseconds()).padStart(3, "0");
}
function pretty(text) {
  if (!text) return "";
  const m = text.match(/```json\s*([\s\S]*?)\s*```/);
  const raw = m ? m[1] : text;
  try { return JSON.stringify(JSON.parse(raw), null, 2); } catch { return raw; }
}
function jsonBlock(v) {
  if (v === undefined || v === null) return "";
  try { return esc(JSON.stringify(v, null, 2)); } catch { return esc(String(v)); }
}

async function refresh() {
  let health, data;
  try {
    [health, data] = await Promise.all([
      fetch("/ai/health").then((r) => r.json()),
      fetch("/ai/traces").then((r) => r.json()),
    ]);
  } catch (e) {
    $("mode").textContent = "服务不可达";
    return;
  }
  $("mode").textContent = "mode: " + health.mode;
  $("count").textContent = data.total + " 条轨迹 / 上限 " + data.limit;
  const traces = data.traces || [];
  renderList(traces);
  if (state.selected) {
    const still = traces.find((t) => t.id === state.selected);
    if (still) await loadDetail(state.selected);
    else { state.selected = null; $("detail").innerHTML = '<div class="empty">← 选择左侧一条轨迹查看完整对话</div>'; }
  }
}

function renderList(traces) {
  const el = $("list");
  if (!traces.length) {
    el.innerHTML = '<div class="empty">暂无决策记录<br><br>进入战争场景（「大模型」难度）后，AI 回合会出现在这里</div>';
    return;
  }
  el.innerHTML = traces.map((t) => `
    <div class="card ${t.id === state.selected ? "sel" : ""}" data-id="${esc(t.id)}">
      <div class="row1">
        <span class="time">${esc(fmtTime(t.started_at))}</span>
        <span class="st ${esc(t.status)}">${esc(t.status)}</span>
        <span class="tk">${esc(t.turn_key)}</span>
      </div>
      <div class="row2">
        <span>${esc(t.mode)} / ${esc(t.model)}</span>
        <span>${t.elapsed_ms != null ? t.elapsed_ms + "ms" : "…"}</span>
        <span>${t.turns ?? 0} 轮 · ${t.tool_calls ?? 0} 工具</span>
      </div>
    </div>`).join("");
  el.querySelectorAll(".card").forEach((c) => c.onclick = () => {
    state.selected = c.dataset.id;
    state.expanded.clear();
    renderList(traces);
    loadDetail(state.selected);
  });
}

async function loadDetail(id) {
  let t;
  try { t = await fetch("/ai/traces/" + encodeURIComponent(id)).then((r) => r.json()); } catch { return; }
  const sig = JSON.stringify([t.status, t.events.length, t.finished_at]);
  // 内容没变就不重绘，避免折叠状态被刷新打断
  if (sig === state.lastSig && $("detail").dataset.id === id) return;
  state.lastSig = sig;
  renderDetail(t);
}

function renderDetail(t) {
  const el = $("detail");
  el.dataset.id = t.id;
  const meta = `
    <div class="meta">
      <span>状态 <b class="st ${esc(t.status)}">${esc(t.status)}</b></span>
      <span>模式 <b>${esc(t.mode)}</b></span>
      <span>模型 <b>${esc(t.model)}</b></span>
      <span>难度 <b>${esc(t.diffculities)}</b>${t.ai_agent_mode ? "（大模型）" : ""}</span>
      <span>耗时 <b>${t.elapsed_ms != null ? t.elapsed_ms + " ms" : "…"}</b></span>
      <span>轮次 <b>${t.budget_used?.turns ?? 0}</b></span>
      <span>工具调用 <b>${t.budget_used?.tool_calls ?? 0}</b></span>
      <span>tokens <b>${t.budget_used?.tokens ?? 0}</b></span>
      <span>合法动作 <b>${esc(t.legal_actions_count)}</b></span>
      <span>开始 <b>${esc(fmtTime(t.started_at))}</b></span>
      ${t.error ? `<span style="color:var(--error)">错误 <b>${esc(t.error)}</b></span>` : ""}
    </div>`;

  const prompts = `
    <details><summary>① System Prompt（点击查看）</summary><pre>${esc(t.system_prompt)}</pre></details>
    <details><summary>② User Message / 战场 JSON（点击查看）</summary><pre>${esc(pretty(t.user_message)) || "（mock 模式无对话）"}</pre></details>
    <div class="hint">③ 对话时间线 — 共 ${t.events.length} 个事件；点击长内容可展开。所有文本按纯文本渲染，防止战场数据注入 HTML。</div>`;

  const kinds = {
    system: "系统提示", user: "用户输入", turn: "轮次", assistant: "模型输出",
    tool_call: "工具调用", tool_result: "工具返回", final: "最终计划", error: "错误", mock: "Mock",
  };

  const events = t.events.map((e) => {
    const key = "e" + e.seq;
    const long = (e.text && e.text.length > 320) || JSON.stringify(e.args ?? e.result ?? "").length > 320;
    const open = state.expanded.has(key);
    const clamp = long && !open ? " clamp" : "";
    const body = e.text ? `<div class="body${clamp}" data-key="${key}">${esc(e.text)}</div>` : "";
    const args = e.args !== undefined ? `<div class="json${clamp}" data-key="${key}">${jsonBlock(e.args)}</div>` : "";
    const result = e.result !== undefined ? `<div class="json${clamp}" data-key="${key}">${jsonBlock(e.result)}</div>` : "";
    return `
      <div class="ev ${esc(e.type)} ${e.ok === false ? "bad" : ""}">
        <div class="head">
          <span class="seq">#${e.seq}</span>
          <span class="kind">${esc(kinds[e.type] || e.type)}</span>
          ${e.turn != null ? `<span>轮 ${e.turn}</span>` : ""}
          ${e.tool ? `<span style="color:var(--call)">${esc(e.tool)}</span>` : ""}
          <span>+${e.at_ms}ms</span>
          ${long ? `<span class="toggle" data-key="${key}">${open ? "收起" : "展开"}</span>` : ""}
        </div>
        ${body}${args}${result}
      </div>`;
  }).join("");

  el.innerHTML = meta + prompts + `<div class="timeline">${events || '<div class="empty">无事件</div>'}</div>`;
  el.querySelectorAll("[data-key]").forEach((n) => {
    n.style.cursor = "pointer";
    n.onclick = () => {
      const k = n.dataset.key;
      if (state.expanded.has(k)) state.expanded.delete(k); else state.expanded.add(k);
      state.lastSig = "";
      renderDetail(t);
    };
  });
}

$("autoBtn").onclick = () => {
  state.auto = !state.auto;
  $("autoBtn").classList.toggle("on", state.auto);
  $("autoBtn").textContent = state.auto ? "自动刷新 · 开" : "自动刷新 · 关";
};
$("clearBtn").onclick = async () => {
  if (!confirm("清空所有决策轨迹？")) return;
  await fetch("/ai/traces", { method: "DELETE" });
  state.selected = null; state.lastSig = ""; state.expanded.clear();
  $("detail").innerHTML = '<div class="empty">← 选择左侧一条轨迹查看完整对话</div>';
  refresh();
};
refresh();
setInterval(() => { if (state.auto) refresh(); }, 2000);
</script>
</body>
</html>
