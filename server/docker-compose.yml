services:
  db:
    image: mysql:8.0
    container_name: 3k-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${MYSQL_DATABASE:-3k}
      MYSQL_USER: ${MYSQL_USER:-3k}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-3kpass}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # 首次初始化（空数据卷时自动执行一次）
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  db_data: