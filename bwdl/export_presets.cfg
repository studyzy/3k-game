html/head_include="<style>\n/* 网页版全屏按钮：贴右侧中部，避开游戏内的菜单/加减速/虚拟按键 */\n#fs-btn {\n\tposition: fixed; right: 6px; top: 46%; margin-top: -20px; z-index: 99999;\n\twidth: 40px; height: 40px; line-height: 38px; text-align: center;\n\tfont-size: 18px; color: #fff; cursor: pointer;\n\tbackground: rgba(0,0,0,0.35);\n\tborder: 1px solid rgba(255,255,255,0.25);\n\tborder-radius: 20px;\n\topacity: 0.55;\n\ttransition: opacity .15s, background .15s;\n\t-webkit-user-select: none; user-select: none;\n\t-webkit-tap-highlight-color: transparent;\n}\n#fs-btn:hover { opacity: 1; background: rgba(0,0,0,0.65); }\n#fs-btn:active { background: rgba(0,0,0,0.85); }\n</style>\n<script>\n(function () {\n\tfunction init() {\n\t\tvar root = document.documentElement;\n\t\tvar req = root.requestFullscreen || root.webkitRequestFullscreen;\n\t\tvar exit = document.exitFullscreen || document.webkitExitFullscreen;\n\t\tif (!req) { return; }\n\t\tvar btn = document.createElement('div');\n\t\tbtn.id = 'fs-btn';\n\t\tbtn.textContent = '⛶';\n\t\tbtn.title = '全屏';\n\t\tdocument.body.appendChild(btn);\n\t\tfunction sync() {\n\t\t\tvar on = document.fullscreenElement || document.webkitFullscreenElement;\n\t\t\tbtn.textContent = on ? '✕' : '⛶';\n\t\t\tbtn.title = on ? '退出全屏' : '全屏';\n\t\t}\n\t\tbtn.addEventListener('click', function (e) {\n\t\t\te.preventDefault();\n\t\t\te.stopPropagation();\n\t\t\tvar on = document.fullscreenElement || document.webkitFullscreenElement;\n\t\t\tvar p = on ? exit.call(document) : req.call(root);\n\t\t\tif (p && p.catch) { p.catch(function () {}); }\n\t\t});\n\t\tdocument.addEventListener('fullscreenchange', sync);\n\t\tdocument.addEventListener('webkitfullscreenchange', sync);\n\t\tsync();\n\t}\n\tif (document.readyState === 'loading') {\n\t\tdocument.addEventListener('DOMContentLoaded', init);\n\t} else {\n\t\tinit();\n\t}\n})();\n</script>"
