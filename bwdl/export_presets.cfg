command_line/extra_args=""
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""
; 相对路径基准 = 项目目录（OS::get_resource_dir()），故实际路径为 bwdl/.ci-signing/release.keystore。
; 本地开发：建软链 bwdl/.ci-signing/release.keystore -> ~/.android/bwdl-release.keystore
; CI：由 secret RELEASE_KEYSTORE_BASE64 还原到该路径
keystore/release=".ci-signing/release.keystore"
keystore/release_user="bwdl"
keystore/release_password="bwdl-release"
